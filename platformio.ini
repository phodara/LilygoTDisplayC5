; PlatformIO Project Configuration File
;
; Basic LilyGO T-Display C5 starter project.
; The ESP32-C5 needs recent Arduino/ESP-IDF support, so this uses the
; pioarduino ESP32 platform, matching LilyGO's current examples.

[platformio]
default_envs = lilygo-t-display-c5
boards_dir = board

[env:lilygo-t-display-c5]
platform = https://github.com/pioarduino/platform-espressif32.git
board = Lilygo-T-Display-C5
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  lovyan03/LovyanGFX
  h2zero/NimBLE-Arduino

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
