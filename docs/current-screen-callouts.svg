<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LilyGO T-Display C5 Wi-Fi Analyzer Screen Callouts</title>
  <desc id="desc">Annotated mockup of the current Wi-Fi analyzer display with callouts for each UI element.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7e3f4"/>
    </marker>
    <style>
      .page { fill: #101418; }
      .device { fill: #1d232b; stroke: #3b4450; stroke-width: 3; }
      .screen { fill: #000000; stroke: #5f6b78; stroke-width: 2; }
      .header { fill: #06145c; }
      .selected { fill: #0f6570; }
      .divider { stroke: #4b5562; stroke-width: 2; }
      .muted { fill: #8a929c; }
      .text { font-family: Menlo, Consolas, monospace; font-size: 18px; fill: #f4f7fb; }
      .small { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #f4f7fb; }
      .tiny { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #d7dce3; }
      .green { fill: #45d66e; }
      .cyan { fill: #5ce0ff; }
      .yellow { fill: #ffe66b; }
      .orange { fill: #ff9f43; }
      .red { fill: #ff5c5c; }
      .calloutBox { fill: #202832; stroke: #6b7785; stroke-width: 1.5; rx: 8; }
      .calloutTitle { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #ffffff; }
      .calloutText { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #c8d0da; }
      .leader { stroke: #d7e3f4; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .leaderDim { stroke: #93a4b8; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="1200" height="720"/>
  <text x="600" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f7fb">Wi-Fi Analyzer Display Callouts</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9da8b6">Current LilyGO T-Display C5 layout</text>

  <g id="device" filter="url(#shadow)">
    <rect class="device" x="70" y="102" width="680" height="392" rx="28"/>
    <rect class="screen" x="90" y="122" width="640" height="340" rx="12"/>

    <g transform="translate(90 122) scale(2)">
      <rect width="320" height="170" fill="#000000"/>

      <rect class="header" x="0" y="0" width="320" height="28"/>
      <text class="small" x="8" y="18">Wifi</text>
      <text class="small green" x="112" y="18">BAT 62%</text>
      <text class="small cyan" x="312" y="18" text-anchor="end">13 APs 1/13</text>

      <text class="tiny muted" x="8" y="42">SSID</text>
      <text class="tiny muted" x="138" y="42">Signal</text>
      <text class="tiny muted" x="232" y="42" text-anchor="end">dBm</text>
      <text class="tiny muted" x="266" y="42" text-anchor="end">Ch</text>
      <text class="tiny muted" x="312" y="42" text-anchor="end">Band</text>

      <rect class="selected" x="0" y="32" width="320" height="21"/>
      <text class="tiny" x="8" y="47">MeshNet</text>
      <rect x="138" y="37" width="52" height="10" fill="none" stroke="#4b5562" stroke-width="1"/>
      <rect x="139" y="38" width="38" height="8" fill="#45d66e"/>
      <text class="tiny green" x="232" y="47" text-anchor="end">-50</text>
      <text class="tiny" x="266" y="47" text-anchor="end">149</text>
      <text class="tiny" x="312" y="47" text-anchor="end">5G</text>

      <text class="tiny" x="8" y="69">Lab-IoT</text>
      <rect x="138" y="59" width="52" height="10" fill="none" stroke="#4b5562" stroke-width="1"/>
      <rect x="139" y="60" width="25" height="8" fill="#ffe66b"/>
      <text class="tiny yellow" x="232" y="69" text-anchor="end">-68</text>
      <text class="tiny" x="266" y="69" text-anchor="end">6</text>
      <text class="tiny" x="312" y="69" text-anchor="end">2.4G</text>

      <line class="divider" x1="0" y1="80" x2="320" y2="80"/>
      <text class="tiny" x="8" y="99">MeshNet</text>
      <text class="tiny cyan" x="312" y="99" text-anchor="end">1/13</text>
      <text class="tiny" x="8" y="113">RSSI -50 dBm 75%</text>
      <text class="tiny" x="8" y="129">5G ch 149 WPA2/3 BSSIDs 1 3.99V</text>

      <rect x="8" y="134" width="304" height="32" fill="none" stroke="#4b5562" stroke-width="1"/>
      <text class="tiny muted" x="11" y="146">-35</text>
      <text class="tiny muted" x="11" y="163">-95</text>
      <polyline points="36,158 68,150 100,152 132,143 164,146 196,139 228,142 260,135 306,137" fill="none" stroke="#45d66e" stroke-width="2"/>
    </g>
  </g>

  <g id="callouts">
    <rect class="calloutBox" x="790" y="105" width="320" height="62"/>
    <text class="calloutTitle" x="808" y="130">Title</text>
    <text class="calloutText" x="808" y="151">Current tool or screen name.</text>
    <path class="leader" d="M 790 136 C 670 130, 400 132, 112 136"/>

    <rect class="calloutBox" x="790" y="182" width="320" height="78"/>
    <text class="calloutTitle" x="808" y="207">Battery SOC</text>
    <text class="calloutText" x="808" y="228">AXP2602 reported percentage.</text>
    <text class="calloutText" x="808" y="247">Voltage appears in the detail line.</text>
    <path class="leader" d="M 790 222 C 690 204, 470 154, 322 136"/>

    <rect class="calloutBox" x="790" y="276" width="320" height="78"/>
    <text class="calloutTitle" x="808" y="301">Scan Status</text>
    <text class="calloutText" x="808" y="322">Shows scanning state, AP count,</text>
    <text class="calloutText" x="808" y="341">and selected network position.</text>
    <path class="leader" d="M 790 315 C 710 265, 645 174, 705 136"/>

    <rect class="calloutBox" x="790" y="370" width="320" height="84"/>
    <text class="calloutTitle" x="808" y="395">Network List</text>
    <text class="calloutText" x="808" y="416">Rows are sorted by RSSI.</text>
    <text class="calloutText" x="808" y="435">Selected row is highlighted.</text>
    <path class="leader" d="M 790 413 C 700 385, 590 220, 91 194"/>

    <rect class="calloutBox" x="790" y="470" width="320" height="92"/>
    <text class="calloutTitle" x="808" y="495">Row Metrics</text>
    <text class="calloutText" x="808" y="516">Signal bar, RSSI dBm, channel,</text>
    <text class="calloutText" x="808" y="535">and detected band for each AP.</text>
    <path class="leader" d="M 790 513 C 694 440, 662 236, 635 216"/>

    <rect class="calloutBox" x="790" y="578" width="320" height="86"/>
    <text class="calloutTitle" x="808" y="603">History Graph</text>
    <text class="calloutText" x="808" y="624">Selected AP RSSI over scans.</text>
    <text class="calloutText" x="808" y="643">Scale is -35 to -95 dBm.</text>
    <path class="leader" d="M 790 620 C 700 602, 575 434, 528 406"/>

    <rect class="calloutBox" x="70" y="535" width="300" height="92"/>
    <text class="calloutTitle" x="88" y="560">Selected AP Detail</text>
    <text class="calloutText" x="88" y="581">SSID, index, RSSI percent,</text>
    <text class="calloutText" x="88" y="600">band, channel, security, BSSID count,</text>
    <text class="calloutText" x="88" y="619">and battery voltage.</text>
    <path class="leaderDim" d="M 370 578 C 445 510, 330 337, 108 312"/>

    <rect class="calloutBox" x="405" y="535" width="300" height="92"/>
    <text class="calloutTitle" x="423" y="560">Controls</text>
    <text class="calloutText" x="423" y="581">Upper selects next AP.</text>
    <text class="calloutText" x="423" y="600">Lower cycles screen views.</text>
    <text class="calloutText" x="423" y="619">Hold both for Bluetooth.</text>
    <path class="leaderDim" d="M 548 535 C 520 482, 456 374, 462 376"/>
  </g>
  <text x="600" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7f8b99">Copyright (c) 2026 Paul Hodara. MIT License.</text>
</svg>
