<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="220 110 760 500" role="img" aria-labelledby="title desc">
  <title id="title">PocketProwler Splash Screen</title>
  <desc id="desc">Release notes graphic showing the PocketProwler startup splash screen on the LilyGO T-Display C5.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#5ce0ff" flood-opacity="0.18"/>
    </filter>
    <style>
      .page { fill: #0f1419; }
      .device { fill: #1c242d; stroke: #46515d; stroke-width: 4; }
      .screenShell { fill: #06090d; stroke: #657180; stroke-width: 3; }
      .screen { fill: #000000; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #aeb9c7; }
      .appName { font-family: Inter, Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: 0; }
      .version { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #5ce0ff; }
      .copyright { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #ccd5df; }
      .register { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
      .caption { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #ccd5df; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #8793a1; }
      .footer { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #7f8b99; }
    </style>
  </defs>

  <rect class="page" width="1200" height="720"/>
  <g id="device" filter="url(#softShadow)">
    <rect class="device" x="260" y="150" width="680" height="430" rx="36"/>
    <rect class="screenShell" x="296" y="184" width="608" height="340" rx="16"/>

    <g id="splash-screen" transform="translate(312 201) scale(1.8)" filter="url(#screenGlow)">
      <rect class="screen" width="320" height="170"/>

      <rect x="0" y="0" width="320" height="25" fill="#000080"/>
      <rect x="0" y="24" width="320" height="25" fill="#0000ff"/>
      <rect x="0" y="48" width="320" height="25" fill="#008b8b"/>
      <rect x="0" y="72" width="320" height="25" fill="#00c853"/>
      <rect x="0" y="96" width="320" height="25" fill="#ffd600"/>
      <rect x="0" y="120" width="320" height="25" fill="#ff9800"/>
      <rect x="0" y="144" width="320" height="26" fill="#d50000"/>

      <rect x="18" y="22" width="284" height="126" fill="#000000"/>
      <rect x="18" y="22" width="284" height="126" fill="none" stroke="#00ffff" stroke-width="1"/>
      <rect x="22" y="26" width="276" height="118" fill="none" stroke="#555555" stroke-width="1"/>

      <rect x="36" y="108" width="8" height="10" fill="#f44336"/>
      <rect x="49" y="100" width="8" height="18" fill="#f44336"/>
      <rect x="62" y="92" width="8" height="26" fill="#ffd600"/>
      <rect x="75" y="84" width="8" height="34" fill="#ffd600"/>
      <rect x="88" y="76" width="8" height="42" fill="#00c853"/>

      <rect x="276" y="108" width="8" height="10" fill="#f44336"/>
      <rect x="263" y="100" width="8" height="18" fill="#f44336"/>
      <rect x="250" y="92" width="8" height="26" fill="#ffd600"/>
      <rect x="237" y="84" width="8" height="34" fill="#ffd600"/>
      <rect x="224" y="76" width="8" height="42" fill="#00c853"/>

      <text x="160" y="58" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">PocketProwler</text>
      <circle cx="262" cy="45" r="7" fill="none" stroke="#ffffff" stroke-width="1"/>
      <text class="register" x="263" y="49" text-anchor="middle">R</text>

      <text x="160" y="92" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#00ffff">Version 2.1.0</text>
      <text x="160" y="126" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#ccd5df">Copyright (c) 2026 Paul Hodara</text>
    </g>
  </g>

</svg>
