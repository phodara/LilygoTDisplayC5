<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LilyGO T-Display C5 Bluetooth Scanner Screen Callouts</title>
  <desc id="desc">Annotated mockup of the Bluetooth Low Energy scanner display with callouts for each UI element.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7e3f4"/>
    </marker>
    <style>
      .page { fill: #101418; }
      .device { fill: #1d232b; stroke: #3b4450; stroke-width: 3; }
      .screen { fill: #000000; stroke: #5f6b78; stroke-width: 2; }
      .header { fill: #06145c; }
      .selected { fill: #0f6570; }
      .divider { stroke: #4b5562; stroke-width: 2; }
      .muted { fill: #8a929c; }
      .small { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #f4f7fb; }
      .tiny { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #d7dce3; }
      .green { fill: #45d66e; }
      .cyan { fill: #5ce0ff; }
      .yellow { fill: #ffe66b; }
      .orange { fill: #ff9f43; }
      .label { fill: #d7dce3; }
      .calloutBox { fill: #202832; stroke: #6b7785; stroke-width: 1.5; rx: 8; }
      .calloutTitle { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #ffffff; }
      .calloutText { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #c8d0da; }
      .leader { stroke: #d7e3f4; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .leaderDim { stroke: #93a4b8; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="1200" height="720"/>
  <text x="600" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f7fb">Bluetooth Scanner Display Callouts</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9da8b6">BLE mode on the LilyGO T-Display C5</text>

  <g id="device" filter="url(#shadow)">
    <rect class="device" x="70" y="102" width="680" height="392" rx="28"/>
    <rect class="screen" x="90" y="122" width="640" height="340" rx="12"/>

    <g transform="translate(90 122) scale(2)">
      <rect width="320" height="170" fill="#000000"/>

      <rect class="header" x="0" y="0" width="320" height="28"/>
      <text class="small" x="8" y="18">Bluetooth</text>
      <text class="small green" x="160" y="18">Passive</text>
      <text class="small cyan" x="312" y="18" text-anchor="end">7 BLE 1/7</text>

      <text class="tiny muted" x="8" y="42">BLE name</text>
      <text class="tiny muted" x="184" y="42">Signal</text>
      <text class="tiny muted" x="276" y="42" text-anchor="end">dBm</text>
      <text class="tiny muted" x="314" y="42" text-anchor="end">Seen</text>

      <rect class="selected" x="0" y="32" width="320" height="19"/>
      <text class="tiny" x="8" y="47">AirPods Pro</text>
      <rect x="184" y="37" width="48" height="10" fill="none" stroke="#4b5562" stroke-width="1"/>
      <rect x="185" y="38" width="36" height="8" fill="#45d66e"/>
      <text class="tiny green" x="276" y="47" text-anchor="end">-49</text>
      <text class="tiny" x="314" y="47" text-anchor="end">1s</text>

      <text class="tiny" x="8" y="67">BLE 8c:42</text>
      <rect x="184" y="57" width="48" height="10" fill="none" stroke="#4b5562" stroke-width="1"/>
      <rect x="185" y="58" width="24" height="8" fill="#ffe66b"/>
      <text class="tiny yellow" x="276" y="67" text-anchor="end">-67</text>
      <text class="tiny" x="314" y="67" text-anchor="end">4s</text>

      <text class="tiny" x="8" y="87">TempSensor</text>
      <rect x="184" y="77" width="48" height="10" fill="none" stroke="#4b5562" stroke-width="1"/>
      <rect x="185" y="78" width="14" height="8" fill="#ff9f43"/>
      <text class="tiny orange" x="276" y="87" text-anchor="end">-79</text>
      <text class="tiny" x="314" y="87" text-anchor="end">8s</text>

      <line class="divider" x1="0" y1="98" x2="320" y2="98"/>
      <text class="tiny" x="8" y="117">AirPods Pro</text>
      <text class="tiny cyan" x="312" y="117" text-anchor="end">1/7</text>
      <text class="tiny label" x="8" y="131">RSSI -49 dBm 76%</text>
      <text class="tiny label" x="8" y="147">Seen 1s  connectable  Passive</text>

      <rect x="8" y="152" width="304" height="14" fill="none" stroke="#4b5562" stroke-width="1"/>
      <polyline points="36,162 70,158 104,161 138,154 172,156 206,153 240,155 278,151 306,153" fill="none" stroke="#45d66e" stroke-width="2"/>
    </g>
  </g>

  <g id="callouts">
    <rect class="calloutBox" x="790" y="105" width="320" height="62"/>
    <text class="calloutTitle" x="808" y="130">Mode Title</text>
    <text class="calloutText" x="808" y="151">Shows that Bluetooth mode is active.</text>
    <path class="leader" d="M 790 136 C 670 130, 400 132, 112 136"/>

    <rect class="calloutBox" x="790" y="182" width="320" height="78"/>
    <text class="calloutTitle" x="808" y="207">Scan Mode</text>
    <text class="calloutText" x="808" y="228">Shows Passive or Active BLE</text>
    <text class="calloutText" x="808" y="247">scan mode in green.</text>
    <path class="leader" d="M 790 222 C 690 204, 530 154, 410 136"/>

    <rect class="calloutBox" x="790" y="276" width="320" height="78"/>
    <text class="calloutTitle" x="808" y="301">BLE Count</text>
    <text class="calloutText" x="808" y="322">Shows device count plus the</text>
    <text class="calloutText" x="808" y="341">selected device position.</text>
    <path class="leader" d="M 790 315 C 704 256, 646 172, 706 136"/>

    <rect class="calloutBox" x="790" y="370" width="320" height="84"/>
    <text class="calloutTitle" x="808" y="395">BLE Device List</text>
    <text class="calloutText" x="808" y="416">Rows are sorted by RSSI.</text>
    <text class="calloutText" x="808" y="435">The selected row is highlighted.</text>
    <path class="leader" d="M 790 413 C 704 380, 610 214, 92 194"/>

    <rect class="calloutBox" x="790" y="470" width="320" height="92"/>
    <text class="calloutTitle" x="808" y="495">Row Metrics</text>
    <text class="calloutText" x="808" y="516">Name or fallback address label,</text>
    <text class="calloutText" x="808" y="535">signal bar, RSSI, and last seen.</text>
    <path class="leader" d="M 790 513 C 700 446, 666 236, 636 216"/>

    <rect class="calloutBox" x="790" y="578" width="320" height="86"/>
    <text class="calloutTitle" x="808" y="603">RSSI History</text>
    <text class="calloutText" x="808" y="624">Selected BLE device strength</text>
    <text class="calloutText" x="808" y="643">over recent scan callbacks.</text>
    <path class="leader" d="M 790 620 C 698 592, 574 438, 536 444"/>

    <rect class="calloutBox" x="70" y="535" width="300" height="92"/>
    <text class="calloutTitle" x="88" y="560">Selected Device Detail</text>
    <text class="calloutText" x="88" y="581">Shows RSSI percentage,</text>
    <text class="calloutText" x="88" y="600">last-seen age, and whether</text>
    <text class="calloutText" x="88" y="619">the advertiser is connectable.</text>
    <path class="leaderDim" d="M 370 578 C 440 504, 326 380, 106 358"/>

    <rect class="calloutBox" x="405" y="535" width="300" height="112"/>
    <text class="calloutTitle" x="423" y="560">Controls</text>
    <text class="calloutText" x="423" y="581">Upper selects next device.</text>
    <text class="calloutText" x="423" y="600">Lower cycles screen views.</text>
    <text class="calloutText" x="423" y="619">Tap both: Passive/Active.</text>
    <text class="calloutText" x="423" y="638">Hold both: WiFi mode.</text>
    <path class="leaderDim" d="M 548 535 C 510 472, 450 288, 110 218"/>
  </g>
  <text x="600" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7f8b99">Copyright (c) 2026 Paul Hodara. MIT License.</text>
</svg>
